<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #020617;
      color: #f8fafc;
      margin: 0;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #1e293b;
    }
    .badge {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 999px;
    }
    h1 { font-size: 13px; font-weight: 800; margin: 0; }
    p { font-size: 11px; color: #94a3b8; line-height: 1.4; margin: 0 0 12px 0; }
    .status {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 10px;
      border-radius: 8px;
      font-size: 11px;
      margin-bottom: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      background: #10b981;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      padding: 8px 0;
      border-radius: 8px;
      text-decoration: none;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>WholesalePlatform</h1>
    <span class="badge">V1.0 ACTIVA</span>
  </div>
  <p>Cuando visites Zillow o Redfin, verás el botón flotante <strong>"⚡ Enviar a WholesalePlatform"</strong> en la esquina inferior derecha.</p>
  <div class="status">
    📡 Dashboard: <strong>http://localhost:3005</strong>
  </div>
  <a href="http://localhost:3005" target="_blank" class="btn">Abrir WholesalePlatform</a>
</body>
</html>
